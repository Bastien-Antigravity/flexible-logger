# [FLEET-ARCHITECT] Fleet Polyglot Release
# Sync-ID: 2026-05-11-GLOBAL-001
name: Fleet Release

on:
  push:
    tags: ['v*']

env:
  GOPRIVATE: 'github.com/Bastien-Antigravity/*'

jobs:
  build_artifacts:
    name: Build Artifacts on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Tag & Version Parity
        shell: bash
        run: |
          if [ ! -f VERSION.txt ]; then
            echo "ERROR: VERSION.txt is missing!" >&2
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION.txt is empty!" >&2
            exit 1
          fi
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "ERROR: Release tag '${GITHUB_REF_NAME}' does not match VERSION.txt ('${VERSION}', expected '${EXPECTED_TAG}')" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version verified: $VERSION (tag: $GITHUB_REF_NAME)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Sibling Dependencies
        shell: bash
        run: |
          if [ -f "go.mod" ]; then
            dropped_replace=false
            while IFS= read -r line; do
              target=$(echo "$line" | awk '{print $NF}')
              mod=$(echo "$line" | awk '{print $1}')
              repo_dir=$(basename "$target")
              if [ ! -d "$target" ]; then
                echo "Cloning missing sibling dependency: $repo_dir into $target..."
                git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Bastien-Antigravity/$repo_dir.git" "$target" 2>/dev/null || true
              fi
              if [ ! -d "$target" ]; then
                echo "Target $target still missing, dropping replace directive for $mod"
                go mod edit -dropreplace "$mod"
                dropped_replace=true
              fi
            done < <(grep -E '=> \.\./' go.mod || true)
            if [ "$dropped_replace" = true ]; then
              GOWORK=off go mod tidy
            fi
          fi

      - name: Build Shared Libraries
        shell: bash
        run: |
          if grep -q "^build-all:" Makefile; then
            make build-all
          elif grep -q "^build:" Makefile; then
            make build
          fi

      - name: Package Python SDK
        shell: bash
        run: |
          # Find all directories containing requirements.txt (excluding hidden ones)
          PYTHON_DIRS=$(find . -maxdepth 3 -name "requirements.txt" -not -path "*/.*" -exec dirname {} \;)
          for dir in $PYTHON_DIRS; do
            if [ -f "$dir/setup.py" ] || [ -f "$dir/pyproject.toml" ]; then
              echo "--- Packaging Python SDK in $dir ---"
              cd "$dir"
              python -m pip install --upgrade pip build setuptools wheel
              python -m build
              cd - > /dev/null
            fi
          done

      - name: Run Unit Tests
        shell: bash
        run: |
          GOWORK=off go test ./src/...

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            **/dist/*.whl
            **/dist/*.tar.gz
            **/lib*/*.so
            **/lib*/*.dll
            **/lib*/*.dylib

  release:
    name: Create GitHub Release
    needs: build_artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
